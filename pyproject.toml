[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-notification-bot"
dynamic = ["version"]
description = "Async library for sending Telegram notifications to one or more chats, built on aiogram 3"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "AI-Stratov", email = "workistratov@gmail.com" },
]
keywords = ["telegram", "bot", "notifications", "aiogram", "multi-chat", "bulk-sending"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
# Lower bounds are the oldest versions tested in CI. aiogram 3.15 requires pydantic>=2.4.1.
dependencies = [
  "aiogram>=3.15.0,<4",
  "pydantic>=2.4.1,<3",
]

[project.urls]
Homepage = "https://github.com/AI-Stratov/tg_notification_bot"
Repository = "https://github.com/AI-Stratov/tg_notification_bot"
Issues = "https://github.com/AI-Stratov/tg_notification_bot/issues"
Documentation = "https://github.com/AI-Stratov/tg_notification_bot/blob/main/docs/usage.md"
Changelog = "https://github.com/AI-Stratov/tg_notification_bot/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.0",
]

[tool.setuptools.dynamic]
version = { attr = "tg_notification_bot.__version__" }

[tool.setuptools.packages.find]
include = ["tg_notification_bot*"]

[tool.setuptools.package-data]
tg_notification_bot = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "B",     # flake8-bugbear
  "UP",    # pyupgrade
  "SIM",   # flake8-simplify
  "PT",    # flake8-pytest-style
  "ASYNC", # flake8-async
  "RUF",   # ruff-specific rules
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers --cov --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["tg_notification_bot"]
branch = true

[tool.coverage.report]
fail_under = 100
skip_covered = true

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --python 3.13
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --python 3.13
      - run: uv run --no-sync mypy tg_notification_bot examples

  test:
    name: test (Python ${{ matrix.python-version }}, ${{ matrix.resolution }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        resolution: ["highest"]
        include:
          - python-version: "3.9"
            resolution: "lowest-direct"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install --resolution ${{ matrix.resolution }} -e ".[dev]"
      - run: uv pip list
      - run: .venv/bin/pytest
